root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/api"
entrypoint = ["./tmp/main"]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor"]
delay = 1000
stop_on_error = true

[build.windows]
cmd = "go build -o ./tmp/main.exe ./cmd/api"
entrypoint = ["tmp\\main.exe"]

[log]
time = true

[misc]
clean_on_exit = true